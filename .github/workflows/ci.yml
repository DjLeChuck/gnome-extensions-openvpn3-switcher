name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check formatting
        run: nix run nixpkgs#nixfmt -- --check flake.nix package.nix
      - name: Flake check
        run: nix flake check
      - name: Build
        run: nix build --print-build-logs
